name: mac-gologin-metrics
on:
  workflow_dispatch:
    inputs:
      resolutions:
        description: 'comma separated WxH list'
        required: false
        default: '1440x900,1280x800,1024x640'
jobs:
  probe:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        menubar: [normal, autohide]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet gologin requests websocket-client
      - name: menu bar mode
        run: |
          if [ "${{ matrix.menubar }}" = "autohide" ]; then
            defaults write NSGlobalDomain _HIHideMenuBar -bool true || true
            killall Finder 2>/dev/null || true
            killall Dock 2>/dev/null || true
            sleep 5
          fi
          echo "menubar mode = ${{ matrix.menubar }}"
          defaults read NSGlobalDomain _HIHideMenuBar 2>/dev/null || echo "(unset)"
      - name: serve page
        run: |
          cd web && nohup python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 3
          curl -s -o /dev/null -w "page http %{http_code}\n" http://127.0.0.1:8000/m.html
      - name: gologin probe
        env:
          GOLOGIN_TOKEN: ${{ secrets.GOLOGIN_TOKEN }}
          RESOLUTIONS: ${{ github.event.inputs.resolutions }}
          MENUBAR: ${{ matrix.menubar }}
        run: python glmac.py
